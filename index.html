<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>贪吃蛇</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #07111f;
      --panel: rgba(17, 24, 39, 0.88);
      --border: rgba(148, 163, 184, 0.2);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-strong: #16a34a;
      --food: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(34, 197, 94, 0.15), transparent 36%),
        linear-gradient(160deg, #020617, var(--bg));
    }

    .game-shell {
      width: min(94vw, 620px);
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.7rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .scoreboard {
      display: flex;
      gap: 10px;
    }

    .score-card {
      min-width: 76px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      text-align: center;
      background: rgba(15, 23, 42, 0.7);
    }

    .score-card span {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .score-card strong {
      display: block;
      margin-top: 3px;
      font-size: 1.2rem;
    }

    .board-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #020617;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: rgba(2, 6, 23, 0.74);
      backdrop-filter: blur(5px);
      transition: opacity 160ms ease;
    }

    .overlay[hidden] {
      display: none;
    }

    .overlay h2 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .overlay p {
      margin: 0 0 18px;
      color: #cbd5e1;
      line-height: 1.6;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 18px;
      color: #052e16;
      background: var(--accent);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }

    button:hover {
      background: #4ade80;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 16px;
    }

    .toolbar p {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .secondary {
      flex: 0 0 auto;
      color: var(--text);
      background: #334155;
    }

    .secondary:hover {
      background: #475569;
    }

    .mobile-controls {
      display: none;
      width: 190px;
      margin: 18px auto 0;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .mobile-controls button {
      min-height: 50px;
      padding: 8px;
      color: var(--text);
      background: #1e293b;
      font-size: 1.1rem;
    }

    .mobile-controls button[data-direction="up"] {
      grid-column: 2;
    }

    .mobile-controls button[data-direction="left"] {
      grid-column: 1;
      grid-row: 2;
    }

    .mobile-controls button[data-direction="down"] {
      grid-column: 2;
      grid-row: 2;
    }

    .mobile-controls button[data-direction="right"] {
      grid-column: 3;
      grid-row: 2;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .game-shell {
        padding: 16px;
        border-radius: 18px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .scoreboard {
        width: 100%;
      }

      .score-card {
        flex: 1;
      }

      .mobile-controls {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <h1>贪吃蛇</h1>
        <p class="subtitle">吃掉果实，避开墙壁和自己的身体。</p>
      </div>
      <div class="scoreboard" aria-label="计分板">
        <div class="score-card">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="score-card">
          <span>Best</span>
          <strong id="bestScore">0</strong>
        </div>
      </div>
    </header>

    <section class="board-wrap" aria-label="贪吃蛇游戏区域">
      <canvas id="game" width="600" height="600"></canvas>
      <div class="overlay" id="overlay">
        <div>
          <h2 id="overlayTitle">准备开始</h2>
          <p id="overlayText">使用方向键或 WASD 控制方向，空格键暂停。</p>
          <button id="startButton" type="button">开始游戏</button>
        </div>
      </div>
    </section>

    <div class="toolbar">
      <p>方向键 / WASD：移动<br />空格：暂停或继续</p>
      <button class="secondary" id="restartButton" type="button">重新开始</button>
    </div>

    <div class="mobile-controls" aria-label="触屏方向控制">
      <button type="button" data-direction="up" aria-label="向上">▲</button>
      <button type="button" data-direction="left" aria-label="向左">◀</button>
      <button type="button" data-direction="down" aria-label="向下">▼</button>
      <button type="button" data-direction="right" aria-label="向右">▶</button>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const context = canvas.getContext("2d");
      const scoreElement = document.getElementById("score");
      const bestScoreElement = document.getElementById("bestScore");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startButton = document.getElementById("startButton");
      const restartButton = document.getElementById("restartButton");
      const directionButtons = document.querySelectorAll("[data-direction]");

      const gridSize = 24;
      const tileSize = canvas.width / gridSize;
      const initialSpeed = 135;
      const minimumSpeed = 65;
      const speedStep = 4;

      const directions = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      const keyDirections = {
        ArrowUp: "up",
        w: "up",
        W: "up",
        ArrowDown: "down",
        s: "down",
        S: "down",
        ArrowLeft: "left",
        a: "left",
        A: "left",
        ArrowRight: "right",
        d: "right",
        D: "right"
      };

      let snake = [];
      let food = { x: 0, y: 0 };
      let direction = directions.right;
      let queuedDirection = directions.right;
      let score = 0;
      let bestScore = Number(localStorage.getItem("snake-best-score")) || 0;
      let timer = null;
      let speed = initialSpeed;
      let state = "ready";
      let touchStart = null;

      bestScoreElement.textContent = String(bestScore);

      function resetGame() {
        stopTimer();
        snake = [
          { x: 11, y: 12 },
          { x: 10, y: 12 },
          { x: 9, y: 12 },
          { x: 8, y: 12 }
        ];
        direction = directions.right;
        queuedDirection = directions.right;
        score = 0;
        speed = initialSpeed;
        state = "ready";
        scoreElement.textContent = "0";
        placeFood();
        draw();
      }

      function startGame() {
        if (state === "game-over" || state === "ready") {
          resetGame();
        }

        state = "running";
        overlay.hidden = true;
        scheduleTick();
      }

      function scheduleTick() {
        stopTimer();
        timer = window.setTimeout(tick, speed);
      }

      function stopTimer() {
        if (timer !== null) {
          window.clearTimeout(timer);
          timer = null;
        }
      }

      function tick() {
        if (state !== "running") {
          return;
        }

        direction = queuedDirection;
        const head = snake[0];
        const nextHead = {
          x: head.x + direction.x,
          y: head.y + direction.y
        };

        const hitsWall =
          nextHead.x < 0 ||
          nextHead.x >= gridSize ||
          nextHead.y < 0 ||
          nextHead.y >= gridSize;

        const grows = nextHead.x === food.x && nextHead.y === food.y;
        const bodyToCheck = grows ? snake : snake.slice(0, -1);
        const hitsBody = bodyToCheck.some(
          segment => segment.x === nextHead.x && segment.y === nextHead.y
        );

        if (hitsWall || hitsBody) {
          endGame();
          return;
        }

        snake.unshift(nextHead);

        if (grows) {
          score += 10;
          scoreElement.textContent = String(score);
          speed = Math.max(minimumSpeed, initialSpeed - Math.floor(score / 10) * speedStep);
          placeFood();
        } else {
          snake.pop();
        }

        draw();
        scheduleTick();
      }

      function setDirection(name) {
        const nextDirection = directions[name];
        if (!nextDirection) {
          return;
        }

        const reversesDirection =
          nextDirection.x + direction.x === 0 &&
          nextDirection.y + direction.y === 0;

        if (!reversesDirection) {
          queuedDirection = nextDirection;
        }
      }

      function placeFood() {
        const emptyCells = [];

        for (let y = 0; y < gridSize; y += 1) {
          for (let x = 0; x < gridSize; x += 1) {
            const occupied = snake.some(segment => segment.x === x && segment.y === y);
            if (!occupied) {
              emptyCells.push({ x, y });
            }
          }
        }

        if (emptyCells.length === 0) {
          endGame(true);
          return;
        }

        food = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      }

      function pauseGame() {
        if (state === "running") {
          state = "paused";
          stopTimer();
          showOverlay("已暂停", "按空格键或点击按钮继续游戏。", "继续游戏");
        } else if (state === "paused") {
          state = "running";
          overlay.hidden = true;
          scheduleTick();
        }
      }

      function endGame(won = false) {
        state = "game-over";
        stopTimer();

        if (score > bestScore) {
          bestScore = score;
          bestScoreElement.textContent = String(bestScore);
          localStorage.setItem("snake-best-score", String(bestScore));
        }

        showOverlay(
          won ? "你赢了！" : "游戏结束",
          `本局得分：${score}。点击按钮再来一局。`,
          "再来一局"
        );
      }

      function showOverlay(title, text, buttonText) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        startButton.textContent = buttonText;
        overlay.hidden = false;
      }

      function draw() {
        context.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();
        drawFood();
        drawSnake();
      }

      function drawGrid() {
        context.fillStyle = "#020617";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.strokeStyle = "rgba(148, 163, 184, 0.06)";
        context.lineWidth = 1;

        for (let i = 1; i < gridSize; i += 1) {
          const position = i * tileSize;
          context.beginPath();
          context.moveTo(position, 0);
          context.lineTo(position, canvas.height);
          context.stroke();
          context.beginPath();
          context.moveTo(0, position);
          context.lineTo(canvas.width, position);
          context.stroke();
        }
      }

      function drawFood() {
        const centerX = food.x * tileSize + tileSize / 2;
        const centerY = food.y * tileSize + tileSize / 2;
        const radius = tileSize * 0.32;

        context.save();
        context.shadowColor = "rgba(251, 113, 133, 0.75)";
        context.shadowBlur = 18;
        context.fillStyle = "#fb7185";
        context.beginPath();
        context.arc(centerX, centerY, radius, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }

      function drawSnake() {
        snake.forEach((segment, index) => {
          const inset = index === 0 ? 2 : 3;
          const x = segment.x * tileSize + inset;
          const y = segment.y * tileSize + inset;
          const size = tileSize - inset * 2;

          context.fillStyle = index === 0 ? "#4ade80" : "#22c55e";
          roundedRect(context, x, y, size, size, 6);
          context.fill();

          if (index === 0) {
            drawEyes(segment);
          }
        });
      }

      function drawEyes(head) {
        const baseX = head.x * tileSize;
        const baseY = head.y * tileSize;
        const forwardX = direction.x * 4;
        const forwardY = direction.y * 4;
        const perpendicularX = direction.y * 4;
        const perpendicularY = -direction.x * 4;
        const centerX = baseX + tileSize / 2 + forwardX;
        const centerY = baseY + tileSize / 2 + forwardY;

        context.fillStyle = "#052e16";
        for (const side of [-1, 1]) {
          context.beginPath();
          context.arc(
            centerX + perpendicularX * side,
            centerY + perpendicularY * side,
            2.2,
            0,
            Math.PI * 2
          );
          context.fill();
        }
      }

      function roundedRect(ctx, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      document.addEventListener("keydown", event => {
        if (event.key === " ") {
          event.preventDefault();
          pauseGame();
          return;
        }

        const directionName = keyDirections[event.key];
        if (directionName) {
          event.preventDefault();
          setDirection(directionName);
          if (state === "ready") {
            startGame();
          }
        }
      });

      startButton.addEventListener("click", () => {
        if (state === "paused") {
          pauseGame();
        } else {
          startGame();
        }
      });

      restartButton.addEventListener("click", () => {
        resetGame();
        startGame();
      });

      directionButtons.forEach(button => {
        button.addEventListener("click", () => {
          setDirection(button.dataset.direction);
          if (state === "ready") {
            startGame();
          }
        });
      });

      canvas.addEventListener("touchstart", event => {
        const touch = event.changedTouches[0];
        touchStart = { x: touch.clientX, y: touch.clientY };
      }, { passive: true });

      canvas.addEventListener("touchend", event => {
        if (!touchStart) {
          return;
        }

        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - touchStart.x;
        const deltaY = touch.clientY - touchStart.y;
        touchStart = null;

        if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < 20) {
          return;
        }

        setDirection(
          Math.abs(deltaX) > Math.abs(deltaY)
            ? (deltaX > 0 ? "right" : "left")
            : (deltaY > 0 ? "down" : "up")
        );

        if (state === "ready") {
          startGame();
        }
      }, { passive: true });

      resetGame();
    })();
  </script>
</body>
</html>
