name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pillow
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile navclaw/*.py bridge/*.py scripts/apply_verified_stop_patch.py tests/*.py
      - run: bash -n scripts/run_one_episode.sh
